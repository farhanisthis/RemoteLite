[workspace]
resolver = "2"
members = [
    "apps/windows/host-service",
    "apps/windows/session-agent",
    "crates/protocol",
    "crates/identity",
    "crates/authorization",
    "crates/transport",
    "crates/session",
    "crates/capture-windows",
    "crates/encoder-windows",
    "crates/input-windows",
    "crates/file-transfer",
    "crates/observability",
    "services/coordination",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OpenRemote Contributors"]
license = "Apache-2.0"
repository = "https://github.com/openremote/openremote"
rust-version = "1.82"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Networking / HTTP
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1.5", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Cryptography
ring = "0.17"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aes-gcm = "0.10"
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
bytes = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
