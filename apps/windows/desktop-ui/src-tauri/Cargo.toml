[package]
name = "openremote-desktop-ui-tauri"
version = "0.1.0"
description = "Tauri 2 backend for OpenRemote desktop application"
authors = ["OpenRemote Contributors"]
license = "Apache-2.0"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
openremote-protocol = { path = "../../../../crates/protocol" }
openremote-identity = { path = "../../../../crates/identity" }
