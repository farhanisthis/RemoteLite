[package]
name = "openremote-session-agent"
description = "OpenRemote Windows interactive session agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "openremote-session-agent"
path = "src/main.rs"

[dependencies]
openremote-protocol = { path = "../../../crates/protocol" }
openremote-transport = { path = "../../../crates/transport" }
openremote-observability = { path = "../../../crates/observability" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
openremote-capture-windows = { path = "../../../crates/capture-windows" }
openremote-encoder-windows = { path = "../../../crates/encoder-windows" }
openremote-input-windows = { path = "../../../crates/input-windows" }
