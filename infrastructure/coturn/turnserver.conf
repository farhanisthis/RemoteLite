# coturn TURN server configuration for OpenRemote
# Replace YOUR_SERVER_IP, YOUR_REALM, and YOUR_SECRET with actual values.

# Listening address
listening-port=3478
tls-listening-port=5349

# Authentication
use-auth-secret
static-auth-secret=change-me-in-production
realm=openremote.dev

# Logging
log-file=/var/log/coturn/turnserver.log
verbose

# Security
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Relay port range
min-port=49152
max-port=65535

# Cipher list
cipher-list="ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
